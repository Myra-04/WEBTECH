<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddies | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="blob blob-pink-1"></div>
    <div class="blob blob-yellow-1"></div>
    <div class="blob blob-mint-1"></div>

    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon">✨</span>
            <span class="logo-text">StudyBuddies</span>
        </a>
        <ul class="nav-links">
            <li><a href="#">Spaces</a></li>
            <li><a href="/bookstore">Bookshelf</a></li>
            <li><a href="#">Chatter</a></li>
        </ul>
        <div class="nav-actions">
            <button class="cart-btn" id="cart-toggle">🛍️ <span class="cart-badge" id="cart-count">{{ cart_count | default('0') }}</span></button>
        </div>
    </nav>

    <section class="portal-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <h2 id="auth-title">Welcome back ✨</h2>
                <p id="auth-subtitle">Log in to access your dashboard and classes.</p>
            </div>

            <div class="auth-toggle">
                <button class="toggle-btn active" id="btn-login">Log In</button>
                <button class="toggle-btn" id="btn-register">Register</button>
            </div>

            <form id="form-login" class="auth-form" action="/login" method="POST">
                
                <div id="login-error" class="error-message"></div>

                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" placeholder="student@edu.my" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('login-password', this)">👁️</button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="btn-primary btn-full">Log In to Dashboard</button>
            </form>

            <form id="form-register" class="auth-form hidden" action="/register" method="POST">
                
                <div id="register-error" class="error-message"></div>

                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="full_name" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label for="reg-uni">University / College</label>
                    <select id="reg-uni" name="university" class="form-select" required>
                        <option value="" disabled selected>Select your institution</option>
                        <option value="UTS">Univ. of Technology Sarawak (UTS)</option>
                        <option value="UNIMAS">UNIMAS</option>
                        <option value="UiTM">UiTM</option>
                        <option value="Swinburne">Swinburne University</option>
                        <option value="Other">Other / Not Listed</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="reg-email">University Email</label>
                    <input type="email" id="reg-email" name="email" placeholder="student@university.edu.my" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Create Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="••••••••" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('reg-password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-full">Create Account</button>
            </form>

        </div>
    </section>

    <script>
        // 1. PASSWORD TOGGLE LOGIC (The Eye Button)
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈"; 
            } else {
                input.type = "password";
                button.textContent = "👁️"; 
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const btnLogin = document.getElementById("btn-login");
            const btnRegister = document.getElementById("btn-register");
            const formLogin = document.getElementById("form-login");
            const formRegister = document.getElementById("form-register");
            const authTitle = document.getElementById("auth-title");
            const authSubtitle = document.getElementById("auth-subtitle");

            // Toggle between Login and Register views
            btnLogin.addEventListener("click", function() {
                btnLogin.classList.add("active");
                btnRegister.classList.remove("active");
                formLogin.classList.remove("hidden");
                formRegister.classList.add("hidden");
                
                authTitle.textContent = "Welcome back ✨";
                authSubtitle.textContent = "Log in to access your dashboard and classes.";
            });

            btnRegister.addEventListener("click", function() {
                btnRegister.classList.add("active");
                btnLogin.classList.remove("active");
                formRegister.classList.remove("hidden");
                formLogin.classList.add("hidden");
                
                authTitle.textContent = "Join the club 🚀";
                authSubtitle.textContent = "Create an account to start studying smarter.";
            });

            // 2. FORM INTERCEPTOR LOGIC (Catching Backend Errors smoothly)
            async function handleFormSubmit(event, form, errorBoxId) {
                event.preventDefault(); // Stop the page from refreshing immediately
                const errorBox = document.getElementById(errorBoxId);
                errorBox.style.display = 'none'; // Hide old errors

                // Gather the data typed into the form
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                    // Send the data to the backend silently
                    const response = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok || response.redirected) {
                        // Success! Send them to the dashboard
                        window.location.href = response.url || '/#course-tracker';
                    } else {
                        // Backend threw an error (like 401 Invalid Password)! Catch it and show it.
                        const errText = await response.text();
                        errorBox.textContent = errText || "Something went wrong. Please try again.";
                        errorBox.style.display = 'block';
                    }
                } catch (err) {
                    errorBox.textContent = "Connection error. Make sure the server is running.";
                    errorBox.style.display = 'block';
                }
            }

            // Attach the interceptor to both forms
            formLogin.addEventListener("submit", (e) => handleFormSubmit(e, formLogin, "login-error"));
            formRegister.addEventListener("submit", (e) => handleFormSubmit(e, formRegister, "register-error"));
        });
    </script>

    <div class="cart-overlay" id="cart-overlay"></div>
    
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart 🛍️</h2>
            <button class="close-cart-btn" id="close-cart">✕</button>
        </div>

        <div class="cart-items-container">
            <div class="cart-item">
                <img src="/images/calculus.jpg" alt="Book" class="cart-item-img">
                <div class="cart-item-info">
                    <span class="cart-item-title">Calculus 101: Advanced Methods</span>
                    <span class="cart-item-price">RM 45</span>
                    <button class="remove-btn">Remove</button>
                </div>
            </div>

            <div class="cart-item">
                <img src="/images/business.jpg" alt="Book" class="cart-item-img">
                <div class="cart-item-info">
                    <span class="cart-item-title">Modern Business Ethics</span>
                    <span class="cart-item-price">RM 35</span>
                    <button class="remove-btn">Remove</button>
                </div>
            </div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span>RM 80</span>
            </div>
            <button onclick="window.location.href='/pages/checkout.html'" class="btn-primary btn-full">Secure Checkout 🔒</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const cartToggleBtn = document.getElementById('cart-toggle');
            const cartDrawer = document.getElementById('cart-drawer');
            const cartOverlay = document.getElementById('cart-overlay');
            const closeCartBtn = document.getElementById('close-cart');

            // Open the cart
            cartToggleBtn.addEventListener('click', () => {
                cartDrawer.classList.add('active');
                cartOverlay.classList.add('active');
            });

            // Close the cart (by clicking the X or the dark background)
            closeCartBtn.addEventListener('click', () => {
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
            });

            cartOverlay.addEventListener('click', () => {
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
            });
        });
    </script>

</body>
</html>
