<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddies | Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon">✨</span>
            <span class="logo-text">StudyBuddies</span>
        </a>
        <div class="nav-actions">
            <button onclick="window.location.href='/courses'" class="btn-secondary">Leave Quiz</button>
        </div>
    </nav>

    <div style="max-width: 800px; margin: 40px auto; padding: 0 40px;">
        
        <div class="quiz-card" id="quiz-container">
            <h2 style="margin-bottom: 5px;">{{ chapter.title | default('Chapter Quiz') }}</h2>
            <span class="quiz-progress-text" id="question-tracker">Question 1 of 5</span>

            <h3 id="question-text" style="font-size: 1.4rem; margin-bottom: 30px; line-height: 1.5;">Loading question...</h3>

            <div id="options-container">
                </div>

            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <button id="back-btn" class="btn-secondary" style="display: none;">← Back</button>
                <button id="next-btn" class="btn-primary" disabled style="opacity: 0.5;">Next Question →</button>
            </div>
        </div>

        <div class="quiz-card" id="results-container" style="display: none; text-align: center; padding: 60px 40px;">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏆</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Quiz Completed!</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px;">You scored <strong id="score-text" style="color: var(--text-dark); font-size: 1.5rem;">0%</strong></p>
            
            <form action="/api/quiz/submit" method="POST">
                <input type="hidden" name="chapter_id" value="{{ chapter_id }}">
                <input type="hidden" name="course_id" value="1"> 
                <input type="hidden" name="score" id="final-score-input" value="0">
                <button type="submit" class="btn-primary btn-large btn-full">Save Score & Return 🚀</button>
            </form>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const rawQuizData = `{{ questions_json | safe }}`;
            let questions = [];

            try {
                questions = JSON.parse(rawQuizData);
            } catch (e) {
                // Fixed dummy questions array to match the DB column names for testing
                questions = [
                    { question_text: "What does HTML stand for?", options: ["Hyper Text Preprocessor", "Hyper Text Markup Language", "Hyper Tool Multi Language"], correct_answer: "Hyper Text Markup Language" },
                    { question_text: "What is the correct CSS syntax to change the background color?", options: ["body {color: black;}", "body:color=black;", "body {background-color: black;}"], correct_answer: "body {background-color: black;}" },
                    { question_text: "Which property is used to change the left margin of an element?", options: ["padding-left", "margin-left", "indent"], correct_answer: "margin-left" }
                ];
            }

            // Game Variables
            let currentQuestionIndex = 0;
            let userAnswers = []; // Array to store answers to support going back!
            let selectedAnswer = null;

            // HTML Elements
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');
            const backBtn = document.getElementById('back-btn');
            const trackerText = document.getElementById('question-tracker');
            
            const quizContainer = document.getElementById('quiz-container');
            const resultsContainer = document.getElementById('results-container');
            const scoreText = document.getElementById('score-text');
            const finalScoreInput = document.getElementById('final-score-input');

            // 1. Load a Question 
            function loadQuestion() {
                const currentQ = questions[currentQuestionIndex];
                
                questionText.innerText = currentQ.question_text;
                trackerText.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
                
                optionsContainer.innerHTML = '';
                
                // Check if they previously answered this question
                selectedAnswer = userAnswers[currentQuestionIndex] || null;
                
                nextBtn.disabled = selectedAnswer === null;
                nextBtn.style.opacity = selectedAnswer === null ? '0.5' : '1';

                // Change Next button text on the last question
                if (currentQuestionIndex === questions.length - 1) {
                    nextBtn.innerText = "Finish Quiz 🎉";
                } else {
                    nextBtn.innerText = "Next Question →";
                }

                // Show or hide the back button
                if (currentQuestionIndex === 0) {
                    backBtn.style.display = 'none';
                } else {
                    backBtn.style.display = 'inline-block';
                }

                // Create Option Buttons
                currentQ.options.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.innerText = optionText;
                    
                    // Highlight if it was previously selected
                    if (selectedAnswer === optionText) {
                        btn.classList.add('selected');
                    }
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        
                        selectedAnswer = optionText; 
                        
                        nextBtn.disabled = false;
                        nextBtn.style.opacity = '1';
                    };
                    
                    optionsContainer.appendChild(btn);
                });
            }

            // 2. Handle Back Button Click
            backBtn.onclick = () => {
                // Save current selection just in case they click back before clicking next
                userAnswers[currentQuestionIndex] = selectedAnswer;

                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    loadQuestion();
                }
            };

            // 3. Handle Next Button Click
            nextBtn.onclick = () => {
                // Save the answer to the array
                userAnswers[currentQuestionIndex] = selectedAnswer;

                currentQuestionIndex++;

                if (currentQuestionIndex >= questions.length) {
                    showResults();
                } else {
                    loadQuestion();
                }
            };

            // 4. Show Final Score
            function showResults() {
                quizContainer.style.display = 'none';
                resultsContainer.style.display = 'block';

                // Calculate correct answers based on the final array
                let correctAnswers = 0;
                questions.forEach((q, index) => {
                    if (userAnswers[index] === q.correct_answer) {
                        correctAnswers++;
                    }
                });

                // Calculate percentage
                const percentage = Math.round((correctAnswers / questions.length) * 100);
                scoreText.innerText = `${percentage}%`;
                
                finalScoreInput.value = percentage;
            }

            // Start the quiz!
            if (questions.length > 0) {
                loadQuestion();
            } else {
                questionText.innerText = "No questions found for this quiz.";
                nextBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
