<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddies | Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon">✨</span>
            <span class="logo-text">StudyBuddies</span>
        </a>
        <div class="nav-actions">
            <button onclick="window.location.href='/courses'" class="btn-secondary">Leave Quiz</button>
        </div>
    </nav>

    <div style="max-width: 800px; margin: 40px auto; padding: 0 40px;">
        
        <div class="quiz-card" id="quiz-container">
            <h2 style="margin-bottom: 5px;">{{ chapter.title | default('Chapter Quiz') }}</h2>
            <span class="quiz-progress-text" id="question-tracker">Question 1 of 5</span>

            <h3 id="question-text" style="font-size: 1.4rem; margin-bottom: 30px; line-height: 1.5;">Loading question...</h3>

            <div id="options-container"></div>

            <div style="display: flex; justify-content: space-between; margin-top: 30px; align-items: center;">
                <button id="back-btn" class="btn-secondary" style="display: none;">← Back</button>
                <button id="next-btn" class="btn-primary" disabled style="opacity: 0.5; margin-left: auto;">Next Question →</button>
            </div>
        </div>

        <div class="quiz-card" id="results-container" style="display: none; text-align: center; padding: 60px 40px;">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏆</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Quiz Completed!</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px;">You scored <strong id="score-text" style="color: var(--text-dark); font-size: 1.5rem;">0%</strong></p>
            
            <form action="/api/quiz/submit" method="POST">
                <input type="hidden" name="chapter_id" value="{{ chapter_id }}">
                <input type="hidden" name="course_id" value="{{ course_id }}">
                <input type="hidden" name="score" id="final-score-input" value="0">
                <button type="submit" class="btn-primary btn-large btn-full">Save Score & Return 🚀</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let questions = {{ questions_json | safe }};
            let currentQuestionIndex = 0;
            
            // MEMORY ARRAY: Stores selected answer index for every question
            let userAnswers = new Array(questions.length).fill(null);

            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');
            const backBtn = document.getElementById('back-btn');
            const trackerText = document.getElementById('question-tracker');
            const quizContainer = document.getElementById('quiz-container');
            const resultsContainer = document.getElementById('results-container');
            const scoreText = document.getElementById('score-text');
            const finalScoreInput = document.getElementById('final-score-input');

            function loadQuestion() {
                const currentQ = questions[currentQuestionIndex];
                questionText.textContent = currentQ.question_text;
                trackerText.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
                
                // Show Back Button only if not on Q1
                backBtn.style.display = (currentQuestionIndex > 0) ? 'inline-block' : 'none';
                
                optionsContainer.innerHTML = '';
                
                // Determine if this question was previously answered
                let savedAnswer = userAnswers[currentQuestionIndex];
                
                nextBtn.disabled = (savedAnswer === null);
                nextBtn.style.opacity = (savedAnswer === null) ? '0.5' : '1';

                let optionsArray = currentQ.options;
                if (typeof optionsArray === 'string') optionsArray = JSON.parse(optionsArray);

                optionsArray.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = optionText; 
                    
                    if (savedAnswer === optionText) btn.classList.add('selected');
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userAnswers[currentQuestionIndex] = optionText; 
                        nextBtn.disabled = false;
                        nextBtn.style.opacity = '1';
                    };
                    optionsContainer.appendChild(btn);
                });
            }
                
            nextBtn.onclick = () => {
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) showResults();
                else loadQuestion();
            };

            backBtn.onclick = () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    loadQuestion();
                }
            };

            function showResults() {
                quizContainer.style.display = 'none';
                resultsContainer.style.display = 'block';

                let correctCount = 0;
                questions.forEach((q, i) => {
                    if (userAnswers[i] === q.correct_answer) correctCount++;
                });

                const percentage = Math.round((correctCount / questions.length) * 100);
                scoreText.innerText = `${percentage}%`;
                finalScoreInput.value = percentage;
            }

            if (questions.length > 0) loadQuestion();
        });
    </script>
</body>
</html>
